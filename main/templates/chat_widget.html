{% load static %}

<div id="chatbot" class="chatbot">
    <!-- Кнопка открытия -->
    <button class="chatbot__button" aria-label="Открыть чат">
        <img src="{% static 'images/chatbot_icon.svg' %}" alt="" class="chatbot__icon">
    </button>

    <!-- Окно чата -->
    <div class="chatbot__window" id="chatbot-window">

        <!-- Шапка -->
        <div class="chatbot__header">
            <img src="{% static 'images/chatbot_avatar.png' %}" alt="" class="chatbot__avatar">
            <div class="chatbot__header-info">
                <span class="chatbot__title">ИИ-ассистент</span>
                <span class="chatbot__status">
                    <span class="chatbot__status-dot"></span>
                    онлайн
                </span>
            </div>
            <button class="chatbot__close" aria-label="Закрыть чат">&times;</button>
        </div>

        <!-- Область сообщений -->
        <div class="chatbot__messages" id="chatbot-messages">
            <div class="chatbot__message chatbot__message--bot">
                <div class="chatbot__message-text">
                    Здравствуйте! Я помогу вам подготовиться к ЕГЭ по русскому языку. Расскажите — что вызывает наибольшие затруднения?
                </div>
            </div>
        </div>

        <!-- Нижняя панель с инпутом -->
        <div class="chatbot__input-area">
            <input type="text" class="chatbot__input" id="chatbot-input" placeholder="Напишите сообщение...">
            <button class="chatbot__send" id="chatbot-send" aria-label="Отправить">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.62">
                    <path d="M5 12h14M13 5l7 7-7 7" />
                </svg>
            </button>
        </div>

    </div>
</div>

<script src="{% static 'js/chatbot.js' %}"></script>
