{% comment %} main\templates\registration\password_reset_complete.html {% endcomment %}
{% load static %}
<!DOCTYPE html>
<html lang='ru'>

<head>
    {% include 'includes/metrika.html' %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Пароль изменён — Нейростат</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link rel="stylesheet" href="{% static 'css/auth.css' %}">
    <link rel="stylesheet" href="{% static 'css/reset.css' %}">
</head>

<body>
    <section class="au-page">
        <div class="au-card">

            <div class="au-card-logo-wrap">
                <img src="{% static 'images/logo_neurostat.png' %}" alt="НЕЙРОСТАТ" class="au-card__logo">
            </div>

            <div class="au-tabs">
                <button class="au-tab au-tab--active" disabled>Готово</button>
            </div>

            <p style="margin: 0 0 14px; font-size: 15px; line-height: 1.55; color: #3d352e;">
                Пароль изменён. Теперь войдите с новым паролем — email тот же.
            </p>

            <a href="{% url 'login' %}" class="btn btn--primary au-form__submit"
                style="display: block; text-align: center; text-decoration: none;">Войти</a>

            <div class="au-divider"></div>

            <div class="au-footer">
                <p class="au-footer__copy">© 2026 Нейростат</p>
            </div>

        </div>
    </section>
</body>

</html>
