# deploy/nginx.conf — ШАБЛОН конфигурации веб-сервера.
#
# ФАКТИЧЕСКАЯ раскладка на боевом сервере (проверено 10.09.2026):
#   - проект:      /home/neurostat          (НЕ /srv/webtable)
#   - сервис:      gunicorn.service         (НЕ gunicorn-webtable)
#   - SSL:         управляется certbot автоматически — правки certbot в боевом
#                  конфиге не переносить в этот шаблон вручную
#   - этот файл:   ориентир для новых location-блоков; боевой конфиг правится
#                  на сервере точечно, с бэкапом и nginx -t перед reload
#
# Применение на сервере: НЕ копировать целиком (затрёт SSL-блок certbot).
# Переносить только нужные location-блоки внутрь существующего server{}.

server {
    listen 80;
    server_name neurostat.ru www.neurostat.ru;

    client_max_body_size 20m;

    # SEO и верификация: файлы, которые поисковики и вебмастеры запрашивают
    # строго в корне домена. Без этого блока nginx проксирует их в Django,
    # маршрута там нет — получается 404, и верификация Яндекса не проходит.
    # Регулярное выражение ограничено точными именами в корне: обход пути
    # невозможен (символы / и . в имени запрещены классом).
    location ~ ^/(robots\.txt|sitemap\.xml|(yandex|google|mailru)_[a-z0-9]+\.html)$ {
        root /home/neurostat;
        access_log off;
    }

    location /static/ {
        alias /home/neurostat/staticfiles/;
    }

    location /media/ {
        alias /home/neurostat/media/;
    }

    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://127.0.0.1:8000;
    }
}
